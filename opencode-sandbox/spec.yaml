schemaVersion: "2"
kind: sandbox
name: opencode-agentmemory
displayName: OpenCode + agentmemory
description: >-
  OpenCode with the agentmemory MCP connected directly to the host agentmemory server, and the host opencode config, skills, plugins and commands mounted read-only (edits on the host apply without rebuilding the kit). Launch it via run-opencode-in-docker-sandbox.sh, which supplies the required home argument.

extends: opencode

args:
  home:
    required: true
    description: >-
      Absolute path of the host user's home directory. The launcher passes --kit-arg home="$HOME". sbx mounts host directories at the same absolute path inside the sandbox, so the read-only OpenCode config appears at <home>/.config/opencode.

environment:
  variables:
    OPENCODE_CONFIG: "${{ kit.args.home }}/.config/opencode/opencode.json"
    AGENTMEMORY_URL: http://host.docker.internal:3111

permissions:
  network:
    allow:
      - registry.npmjs.org
      - "*.npmjs.org"
      - opencode.ai:443
      - host.docker.internal:3111

setup:
  install:
    - command: "command -v agentmemory || npm install -g @agentmemory/agentmemory@0.9.30 --no-fund --no-audit"
      description: Install the pinned agentmemory MCP client
    - command: "mkdir -p /home/agent/.config/opencode && ln -sfn '${{ kit.args.home }}/.config/opencode/skills' /home/agent/.config/opencode/skills && ln -sfn '${{ kit.args.home }}/.config/opencode/commands' /home/agent/.config/opencode/commands && ln -sfn '${{ kit.args.home }}/.config/opencode/plugins' /home/agent/.config/opencode/plugins"
      description: Symlink skills, commands and plugins from the read-only host mount
    - command: |
        if ! grep -q AGENTMEMORY_SECRET /etc/sandbox-persistent.sh 2>/dev/null; then
          printf '%s\n' 'if [ -r ${{ kit.args.home }}/.config/opencode/agentmemory-secret ]; then AGENTMEMORY_SECRET=$(cat ${{ kit.args.home }}/.config/opencode/agentmemory-secret); export AGENTMEMORY_SECRET; fi' >> /etc/sandbox-persistent.sh
        fi
      description: Export the agentmemory API secret into the sandbox environment

agentInstructions:
  content: |
    ## Sandbox environment

    - OpenCode config, skills, plugins and commands are mounted read-only from the host at `${{ kit.args.home }}/.config/opencode`. Edit them on the host; changes apply without rebuilding this sandbox.
    - The `agentmemory` MCP connects directly to the host agentmemory server at `http://host.docker.internal:3111` (see `AGENTMEMORY_URL`). This is optional: if the host server is not running, the MCP automatically switches to a reduced sandbox-local toolset (explicit saves only, kept inside the sandbox and never synced to the host) and automatic capture pauses. The full toolset and capture resume automatically once the host server is reachable again.
    - Docker is available inside the sandbox; prefer it for running code. `sudo` is passwordless for the `agent` user.
